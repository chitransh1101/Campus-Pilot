server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the built app for every path — this is a client-rendered single
    # page, so any path that isn't a real static file should still get
    # index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reasonable caching for hashed build assets (Vite fingerprints its
    # output filenames, so this is safe — a new build always gets new
    # filenames instead of reusing a stale cached one).
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
